services:
  blog:
    build:
      context: .
      args:
        # 由主机守护脚本在构建时传入当前 commit；手动构建可不传，默认 unknown。
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: blog
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./content:/app/content
      - ./data:/app/data
